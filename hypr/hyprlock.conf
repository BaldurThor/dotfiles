general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# Blurred screenshot background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ==========================================
# SYSTEM READOUT (Above Center)
# ==========================================

shape {
    monitor =
    size = 960, 298
    color = rgba(24, 24, 37, 0.70)
    rounding = 14
    border_size = 1
    border_color = rgba(255, 255, 255, 0.15)

    position = 0, 195
    halign = center
    valign = center
}


label {
    monitor =
    text = cmd[update:0] sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/ /\xC2\xA0/g' ~/.config/hypr/title1.txt
    color = rgba(251, 47, 60, 1.0)
    font_size = 16
    font_family = 3270 Nerd Font
    text_align = left

    position = -408, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/ /\xC2\xA0/g' ~/.config/hypr/title2.txt
    color = rgba(112, 232, 87, 1.0)
    font_size = 16
    font_family = 3270 Nerd Font
    text_align = left

    position = -210, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/ /\xC2\xA0/g' ~/.config/hypr/title3.txt
    color = rgba(23, 147, 209, 1.0)
    font_size = 16
    font_family = 3270 Nerd Font
    text_align = left

    position = 204, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = <span><b>------------------------------------------------------------------------------</b></span>
    color = rgba(205, 214, 244, 0.95)
    font_size = 16
    font_family = 3270 Nerd Font

    position = 0, 282
    halign = center
    valign = center
}

label {
    monitor =
    # %H:%M = 24-hour time (hh:mm), %d/%m/%Y = day/month/year
    text = cmd[update:1000] echo "<b>$TIME</b>  |  $(date +'%d/%m/%Y')"
    color = rgba(205, 214, 244, 0.95)
    font_size = 16
    font_family = 3270 Nerd Font

    position = 0, 307
    halign = center
    valign = center
}

# ==========================================
# PASSWORD INPUT FIELD (Dead Center)
# ==========================================

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(137, 180, 250, 0.5)
    inner_color = rgba(24, 24, 37, 0.85)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8"><i>Enter Password...</i></span>
    hide_input = false
    rounding = 12
    font_family = 3270 Nerd Font

    check_color = rgba(249, 226, 175, 0.8)
    fail_color = rgba(243, 139, 168, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(250, 179, 135, 0.9)

    position = 0, -10
    halign = center
    valign = center
}

# ==========================================
# POWER BUTTONS (Bottom Center)
# ==========================================

# Restart Pill Background
shape {
    monitor =
    size = 135, 42
    color = rgba(24, 24, 37, 0.75)
    rounding = 10
    border_size = 1
    border_color = rgba(255, 255, 255, 0.18)

    position = -75, 45
    halign = center
    valign = bottom

    onclick = systemctl reboot
}

# Restart Label (Using left alignment relative to the pill's absolute anchor trick)
label {
    monitor =
    text = 󰜉 Restart
    color = rgba(205, 214, 244, 0.95)
    font_size = 13
    font_family = 3270 Nerd Font

    position = -75, 55
    halign = center
    valign = bottom

    onclick = systemctl reboot
}

# Shutdown Pill Background
shape {
    monitor =
    size = 135, 42
    color = rgba(24, 24, 37, 0.75)
    rounding = 10
    border_size = 1
    border_color = rgba(243, 139, 168, 0.35)

    position = 75, 45
    halign = center
    valign = bottom

    onclick = systemctl poweroff
}

# Shutdown Label
label {
    monitor =
    text = 󰐥 Shutdown
    color = rgba(243, 139, 168, 0.95)
    font_size = 13
    font_family = 3270 Nerd Font

    position = 75, 55
    halign = center
    valign = bottom

    onclick = systemctl poweroff
}